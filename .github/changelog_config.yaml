# Changelog Generator Configuration for Bluefin
# Adapted from bluefin-lts config with Bluefin-specific settings

# Basic configuration
os_name: "bluefin"
targets: ["stable"]
registry_url: "ghcr.io/projectbluefin"

# Package blacklist - packages to exclude from changelog
package_blacklist:
  - "kernel"
  - "gnome-shell"
  - "mesa-filesystem"
  - "podman"
  - "docker-ce"
  - "incus"
  - "devpod"
  - "nvidia-driver"

# Image variants for different targets
image_variants:
  - "base"

# Regex patterns
patterns:
  centos: "\\.fc\\d\\d"
  start_pattern: "{target}\\.\\d\\d\\d+"

# Template patterns for package changes
templates:
  pattern_add: "\n| ✨ | {name} | | {version} |"
  pattern_change: "\n| 🔄 | {name} | {prev} | {new} |"
  pattern_remove: "\n| ❌ | {name} | {version} | |"
  pattern_pkgrel_changed: "{prev} ➡️ {new}"
  pattern_pkgrel: "{version}"
  common_pattern: "### {title}\n| | Name | Previous | New |\n| --- | --- | --- | --- |{changes}\n\n"
  commits_format: "### Commits\n| Hash | Subject | Author |\n| --- | --- | --- |{commits}\n\n"
  commit_format: "\n| **[{short}](https://github.com/projectbluefin/bluefin/commit/{githash})** | {subject} | {author} |"
  changelog_title: "{tag}: {pretty}"
  handwritten_placeholder: "This is an automatically generated changelog for release `{curr}`."
  changelog_format: |
    {handwritten}

    From previous `{target}` version `{prev}` there have been the following changes. **One package per new version shown.**

    ### Major packages
    | Name | Version |
    | --- | --- |
    | **Kernel** | {pkgrel:kernel} |
    | **Gnome** | {pkgrel:gnome-shell} |
    | **Mesa** | {pkgrel:mesa-filesystem} |
    | **Podman** | {pkgrel:podman} |
    | **Nvidia** | {pkgrel:nvidia-driver} |

    {changes}

    ### How to rebase
    For current users, type the following to rebase to this version:
    ```bash
    # Get Image Name
    IMAGE_NAME=$(jq -r '.["image-name"]' < /usr/share/ublue-os/image-info.json)

    # For this Stream
    sudo bootc switch --enforce-container-sigpolicy ghcr.io/projectbluefin/$IMAGE_NAME:{target}

    # For this Specific Image:
    sudo bootc switch --enforce-container-sigpolicy ghcr.io/projectbluefin/$IMAGE_NAME:{curr}
    ```

    ### Documentation
    Be sure to read the [documentation](https://docs.projectbluefin.io/) for more information
    on how to use your cloud native system.

# Section names for different image types
sections:
  all: "All Images"
  base: "Base Images"
  nvidia-open: "Nvidia Images"

# Default configuration values
defaults:
  retries: 3
  retry_wait: 5
  timeout_seconds: 30
  output_file: "changelog.md"
  env_output_file: "output.env"
  enable_commits: true
